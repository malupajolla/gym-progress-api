<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym Progress</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Gym Progress</h1>

    <section class="card">
      <h2>Novo exercício</h2>
      <form id="form-exercicio">
        <input id="nome" placeholder="Nome (ex.: Supino reto)" required>
        <input id="grupo" placeholder="Grupo muscular (ex.: Peito)" required>
        <button type="submit">Adicionar</button>
      </form>
    </section>

    <section class="card">
      <h2>Exercícios</h2>
      <ul id="lista-exercicios"></ul>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
